name: Build

on:
  push:
    branches: ['**']               # auch Port-Branches (z. B. ixus145)
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  XPACK_VERSION: 10.3.1-2.3

# Kameras kommen aus tools/filmsim/cameras.txt: jede wird in einem eigenen
# Job auf einer frischen Maschine gebaut. Das GitHub-Release bekommt nur
# Kameras mit Status "stabil", die Webseite alle (Status "test" dort als Beta,
# damit Nutzer sie mit der Testseite #test pruefen koennen).
jobs:
  setup:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.cameras.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Version pruefen
        id: version
        run: |
          version=$(sed -n 's/^#define FILMSIM_VERSION "\(.*\)"/\1/p' core/filmsim.h)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu FILMSIM_VERSION $version in core/filmsim.h"
            exit 1
          fi

      - name: Kameraliste lesen
        id: cameras
        run: |
          matrix=$(awk '!/^#/ && NF { printf "%s{\"platform\":\"%s\",\"sub\":\"%s\",\"status\":\"%s\"}", n++ ? "," : "", $1, $2, $3 }
                        END { if (!n) exit 1 }' tools/filmsim/cameras.txt)
          echo "matrix={\"include\":[$matrix]}" >> "$GITHUB_OUTPUT"
          echo "{\"include\":[$matrix]}"

      - name: PC-Test FILMS.TXT-Parser
        run: |
          gcc -Wall -Wextra -I core -o "$RUNNER_TEMP/test_films_txt" tools/filmsim/test_films_txt.c core/filmsim_txt.c
          "$RUNNER_TEMP/test_films_txt" CHDK/FILMS/EXAMPLE.TXT

      - name: PC-Test RECIPES.TXT-Parser
        run: |
          gcc -Wall -Wextra -I core -o "$RUNNER_TEMP/test_recipes" tools/filmsim/test_recipes.c core/filmsim_recipe.c
          "$RUNNER_TEMP/test_recipes"

      - name: PC-Test SD-Installer (Bootsektor, Kameraliste)
        run: |
          make -C tools/installer test_core
          tools/installer/test_core tools/filmsim/cameras.txt "$RUNNER_TEMP/installer"

      - name: PC-Test Rohdaten (10 und 12 Bit)
        run: |
          for b in 10 12; do
            gcc -Wall -Wextra -Werror -I core -DCAM_SENSOR_BITS_PER_PIXEL=$b -o "$RUNNER_TEMP/test_raw$b" tools/filmsim/test_raw.c
            "$RUNNER_TEMP/test_raw$b"
          done

  build:
    needs: setup
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: build (${{ matrix.platform }} ${{ matrix.sub }}, ${{ matrix.status }})
    env:
      VERSION: ${{ needs.setup.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain aus dem Cache
        id: toolchain
        uses: actions/cache@v4
        with:
          path: ~/xpack-arm-none-eabi-gcc
          key: xpack-arm-none-eabi-gcc-${{ env.XPACK_VERSION }}-linux-x64

      - name: Toolchain laden (xPack GCC)
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v$XPACK_VERSION
          file=xpack-arm-none-eabi-gcc-$XPACK_VERSION-linux-x64.tar.gz
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$file"
          curl -fsSLO "$base/$file.sha"
          sha256sum -c "$file.sha"
          mkdir -p ~/xpack-arm-none-eabi-gcc
          tar -xzf "$file" -C ~/xpack-arm-none-eabi-gcc --strip-components=1

      - name: Toolchain in PATH
        run: |
          echo "$HOME/xpack-arm-none-eabi-gcc/bin" >> "$GITHUB_PATH"
          command -v zip >/dev/null || sudo apt-get install -y zip

      - name: Firmware bauen
        run: |
          arm-none-eabi-gcc --version | head -1
          # alle Firmwares der Kamera (cameras.txt), Aliase als Kopie, dazu das Pruefprogramm
          sh tools/filmsim/build.sh $PLATFORM
          mv dist/$VERSION/*-full.zip dist/
          for z in dist/*.zip; do echo "$z"; unzip -l "$z" | grep -E 'DISKBOOT.BIN|PS.FIR'; done
          # Firmware-Pruefprogramm fuer den Installer
          ls -l tools/installer/probes/FWPROBE-$PLATFORM.BIN

      - uses: actions/upload-artifact@v4
        with:
          name: exccd-${{ env.VERSION }}-${{ env.PLATFORM }}
          path: dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: fwprobe-${{ env.PLATFORM }}
          path: tools/installer/probes/FWPROBE-${{ env.PLATFORM }}.BIN

  # SD-Karten-Installer fuer Windows (MinGW-Cross-Build, unsigniert)
  installer:
    needs: [setup, build]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Firmware-Pruefprogramme aus den Kamera-Builds, werden in die .exe eingebettet
      - uses: actions/download-artifact@v4
        with:
          pattern: fwprobe-*
          path: tools/installer/probes
          merge-multiple: true

      - name: Installer bauen
        run: |
          sudo apt-get update -q && sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
          make -C tools/installer CROSS=x86_64-w64-mingw32- VERSION=$VERSION
          ls -l tools/installer/exccd-installer.exe

      - uses: actions/upload-artifact@v4
        with:
          name: exccd-installer
          path: tools/installer/exccd-installer.exe

  site:
    needs: [setup, build, installer]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.setup.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: exccd-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: exccd-installer
          path: installer

      - name: Installer mit allen Firmware-ZIPs testen
        run: |
          make -C tools/installer test_core
          tools/installer/test_core tools/filmsim/cameras.txt "$RUNNER_TEMP/installer" dist/*.zip

      - name: Stabile Kameras auswaehlen
        run: |
          mkdir -p release
          # nur die erste Firmware ist auf der Kamera getestet (cameras.txt)
          for cam in $(awk '!/^#/ && $3 == "stabil" { split($2, s, ","); print $1 "-" s[1] }' tools/filmsim/cameras.txt); do
            cp "dist/exccd-$VERSION-$cam-full.zip" release/
          done
          ls -l release

      - name: Download-Webseite bauen und pruefen
        run: |
          sudo apt-get update -q && sudo apt-get install -y python3-pil
          gcc -Wall -Wextra -I core -o "$RUNNER_TEMP/test_films_txt" tools/filmsim/test_films_txt.c core/filmsim_txt.c
          python3 tools/site/build_site.py dist/exccd-$VERSION-*-full.zip _site --version "$VERSION"
          node tools/site/test_zipjoin.mjs _site "$RUNNER_TEMP/zipjoin"
          python3 tools/filmsim/make_curves.py "$RUNNER_TEMP/curves" > /dev/null
          node tools/site/test_curves.mjs _site "$RUNNER_TEMP/curves"
          for z in "$RUNNER_TEMP"/zipjoin/*.zip; do unzip -tq "$z"; done
          "$RUNNER_TEMP/test_films_txt" "$RUNNER_TEMP/zipjoin/FILMS-all.TXT"
          tools/installer/test_core tools/filmsim/cameras.txt "$RUNNER_TEMP/installer-site" "$RUNNER_TEMP"/zipjoin/exccd-*.zip
          cp installer/exccd-installer.exe _site/

      - uses: actions/upload-pages-artifact@v4
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          path: _site

      - name: Release anlegen
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip installer/exccd-installer.exe --title "EXCCD $GITHUB_REF_NAME" --generate-notes

  # Webseite nur bei Releases (Tag) oder von Hand veroeffentlichen.
  # Einmalig im Repo einstellen: Settings -> Pages -> Source: GitHub Actions
  pages:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
